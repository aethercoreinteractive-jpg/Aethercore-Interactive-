<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercore | Interactive Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0B0B0C; color: #FFFFFF; }
        .glass-nav { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .app-item { transition: transform 0.2s ease; }
        .app-item:active { transform: scale(0.95); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="glass-nav sticky top-0 z-50 px-6 pt-6 pb-4">
        <div class="flex items-center gap-3 mb-5">
            <img src="Aethercore Logo.png" class="w-9 h-9 rounded-full border border-gray-700 object-cover">
            <h1 class="text-lg font-bold tracking-tight">Aethercore <span class="text-blue-500">Interactive</span></h1>
        </div>
        <input type="text" id="searchInput" placeholder="Search ecosystem..." 
               class="w-full bg-[#1A1A1A] rounded-xl px-4 py-3 text-sm outline-none border border-gray-800 focus:border-blue-600 transition-all">
    </header>

    <main id="store-content" class="py-4"></main>

    <script src="data.js"></script>
    <script>
        const content = document.getElementById('store-content');
        const searchInput = document.getElementById('searchInput');

        function render(filter = "") {
            content.innerHTML = "";
            const query = filter.toLowerCase();
            const sortedCategories = Object.keys(categoryOrder).sort((a, b) => categoryOrder[a] - categoryOrder[b]);

            sortedCategories.forEach(cat => {
                const apps = aetherCoreApps.filter(a => a.category === cat && 
                    (a.title.toLowerCase().includes(query) || a.description.toLowerCase().includes(query)));
                
                if (apps.length > 0) {
                    const section = document.createElement('section');
                    section.className = "mb-10";
                    section.innerHTML = `<h2 class="px-6 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 mb-4">${cat}</h2><div class="flex gap-4 px-6 overflow-x-auto hide-scrollbar"></div>`;
                    
                    const row = section.querySelector('.flex');
                    apps.forEach(app => {
                        row.innerHTML += `
                            <div onclick="window.location.href='app.html?id=${app.id}'" class="min-w-[80px] flex flex-col items-center app-item cursor-pointer">
                                <div class="w-16 h-16 rounded-[20px] shadow-2xl overflow-hidden border border-gray-800 bg-[#1A1A1A]">
                                    <img src="${app.logo}" class="w-full h-full object-cover">
                                </div>
                                <span class="mt-2 text-[11px] font-medium text-center text-gray-300 leading-tight w-20 truncate">${app.title}</span>
                            </div>
                        `;
                    });
                    content.appendChild(section);
                }
            });
        }
        searchInput.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
