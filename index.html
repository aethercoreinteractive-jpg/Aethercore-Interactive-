<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethercore Interactive | Infrastructure for modern business</title>
    <style>
        :root {
            --obsidian: #050505;
            --smoke: #141414;
            --gold: #d4af37;
            --white: #ffffff;
            --grey: #888888;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--obsidian); color: var(--white); margin: 0; line-height: 1.5; }

        /* Brand Header */
        .brand-header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #222; }
        .logo-main { height: 45px; margin-bottom: 12px; }
        .company-name { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; color: var(--white); }
        .tagline { font-size: 0.9rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }

        /* Modules */
        .module { padding: 40px 20px; }
        input, textarea { width: 100%; background: var(--smoke); border: 1px solid #333; color: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; }
        .btn-gold { background: var(--gold); border: none; padding: 20px; width: 100%; border-radius: 12px; font-weight: 800; color: #000; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--smoke); padding: 20px; border-radius: 16px; text-align: center; }

        footer { text-align: center; padding: 40px 20px; color: var(--grey); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header class="brand-header">
        <img src="Aethercore Logo.png" class="logo-main" alt="Aethercore">
        <div class="company-name">Aethercore Interactive</div>
        <div class="tagline">Infrastructure for modern business</div>
    </header>

    <section class="module">
        <h2 style="font-size: 0.8rem; color: var(--gold); margin-bottom: 15px;">PROJECT INTAKE</h2>
        <input type="text" placeholder="Project Name">
        <textarea placeholder="Technical Specifications..." rows="4"></textarea>
        <button class="btn-gold">INITIATE PARTNERSHIP</button>
    </section>

    <section class="module">
        <h2 style="font-size: 0.8rem; color: var(--gold); margin-bottom: 15px;">OPERATIONAL PORTFOLIO</h2>
        <div class="grid">
            <div class="card">FinTech OS</div>
            <div class="card">Cloud ERP</div>
            <div class="card">AI Logistics</div>
            <div class="card">Cyber Edge</div>
        </div>
    </section>

    <footer>
        <div style="color: var(--gold); font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">aethercoreinteractive@gmail.com</div>
        <div>GLOBAL INFRASTRUCTURE DIVISION</div>
    </footer>

</body>
</html>
