<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercore | Interactive Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-header { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.85); }
        .app-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .app-card:hover { transform: translateY(-8px); }
    </style>
</head>
<body class="bg-[#F8F9FA]">

    <header class="glass-header sticky top-0 z-50 border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <img src="Aethercore Logo.png" class="w-10 h-10 object-contain">
                <div>
                    <h1 class="text-sm font-bold tracking-widest uppercase text-gray-400">Aethercore</h1>
                    <p class="text-lg font-extrabold text-gray-900 leading-none">Interactive</p>
                </div>
            </div>
            <div class="w-10 h-10 rounded-full bg-gray-900 text-white flex items-center justify-center font-bold text-sm">AI</div>
        </div>
        
        <div class="bg-white border border-gray-200 rounded-2xl px-5 py-3 flex items-center shadow-sm">
            <span class="mr-3 opacity-50">🔍</span>
            <input type="text" id="searchInput" placeholder="Discover professional tools..." 
                   class="bg-transparent w-full outline-none text-sm text-gray-800 placeholder:text-gray-400">
        </div>
    </header>

    <main id="store-content" class="py-8 space-y-12"></main>

    <script src="data.js"></script>
    <script>
        const content = document.getElementById('store-content');
        const searchInput = document.getElementById('searchInput');

        function render(filter = "") {
            content.innerHTML = "";
            const query = filter.toLowerCase();
            const sortedCategories = Object.keys(categoryOrder).sort((a, b) => categoryOrder[a] - categoryOrder[b]);

            sortedCategories.forEach(cat => {
                const apps = aetherCoreApps.filter(a => a.category === cat && 
                    (a.title.toLowerCase().includes(query) || a.description.toLowerCase().includes(query)));
                
                if (apps.length > 0) {
                    const section = document.createElement('section');
                    section.innerHTML = `<h2 class="px-6 text-xs font-black uppercase tracking-[0.2em] text-gray-400 mb-6">${cat}</h2><div class="flex gap-6 px-6 overflow-x-auto pb-4 scrollbar-hide"></div>`;
                    
                    const row = section.querySelector('.flex');
                    apps.forEach(app => {
                        row.innerHTML += `
                            <div onclick="window.location.href='app.html?id=${app.id}'" class="min-w-[120px] app-card cursor-pointer">
                                <div class="w-28 h-28 rounded-3xl shadow-xl border border-gray-100 overflow-hidden bg-white">
                                    <img src="${app.logo}" class="w-full h-full object-cover">
                                </div>
                                <h3 class="mt-4 text-sm font-semibold text-gray-900 text-center">${app.title}</h3>
                            </div>
                        `;
                    });
                    content.appendChild(section);
                }
            });
        }
        searchInput.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
