<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aethercore Interactive | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="data.js"></script>
</head>
<body class="bg-slate-50">
    <nav class="bg-white shadow-sm border-b p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex items-center gap-3">
            <img src="Aethercore Logo.png" alt="Aethercore Logo" class="h-10 w-auto">
            <span class="text-xl font-black text-slate-800 tracking-tight">INTERACTIVE</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-8">
        <h2 class="text-2xl font-bold mb-6">Our Applications</h2>
        <div id="appGrid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div>
    </main>

    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 relative">
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="absolute top-4 right-4 text-2xl font-bold">×</button>
            <div class="swiper mySwiper w-full h-64 mb-4">
                <div class="swiper-wrapper" id="modal-previews"></div>
                <div class="swiper-pagination"></div>
            </div>
            <h2 id="m-title" class="text-2xl font-black"></h2>
            <p id="m-desc" class="text-slate-600 mt-2 text-sm leading-relaxed"></p>
            <a id="m-link" href="#" class="mt-6 block w-full bg-blue-600 text-white text-center py-3 rounded-xl font-bold hover:bg-blue-700 transition">OPEN APPLICATION</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const grid = document.getElementById('appGrid');
        aetherCoreApps.forEach(app => {
            grid.innerHTML += `
                <div onclick="openModal(${app.id})" class="cursor-pointer bg-white p-4 rounded-3xl shadow-sm hover:shadow-lg transition-all duration-300">
                    <img src="${app.logo}" class="w-full h-auto rounded-2xl mb-3">
                    <h3 class="text-center font-bold text-sm truncate">${app.title}</h3>
                </div>
            `;
        });

        function openModal(id) {
            const app = aetherCoreApps.find(a => a.id === id);
            document.getElementById('m-title').innerText = app.title;
            document.getElementById('m-desc').innerText = app.description;
            document.getElementById('m-link').href = app.url;
            document.getElementById('modal-previews').innerHTML = app.preview.map(p => 
                `<div class="swiper-slide"><img src="${p}" class="w-full h-full object-cover rounded-2xl"></div>`).join('');
            document.getElementById('modal').classList.remove('hidden');
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination" } });
        }
    </script>
</body>
</html>
