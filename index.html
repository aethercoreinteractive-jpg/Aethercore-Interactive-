<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aethercore Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
</head>
<body class="bg-white pb-10">
    <header class="p-6 font-black text-2xl tracking-tighter">Aethercore Play</header>
    
    <!-- Search Bar -->
    <div class="px-6 mb-6">
        <input type="text" id="searchInput" placeholder="Search for apps & games" 
               class="w-full bg-gray-100 rounded-full px-5 py-3 outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <main id="store-content" class="space-y-10"></main>

    <script>
        const content = document.getElementById('store-content');
        const searchInput = document.getElementById('searchInput');

        function render(filter = "") {
            content.innerHTML = ""; // Clear current view
            
            const sortedCategories = Object.keys(categoryOrder).sort((a, b) => categoryOrder[a] - categoryOrder[b]);

            sortedCategories.forEach(cat => {
                const appsInCategory = aetherCoreApps.filter(a => 
                    a.category === cat && 
                    a.title.toLowerCase().includes(filter.toLowerCase())
                );
                
                if (appsInCategory.length > 0) {
                    const section = document.createElement('section');
                    section.innerHTML = `<h2 class="px-6 text-xl font-bold mb-4">${cat}</h2><div class="flex gap-4 px-6 overflow-x-auto pb-4"></div>`;
                    
                    const row = section.querySelector('.flex');
                    appsInCategory.forEach(app => {
                        row.innerHTML += `
                            <div onclick="window.location.href='app.html?id=${app.id}'" class="min-w-[100px] cursor-pointer">
                                <img src="${app.logo}" class="w-24 h-24 rounded-2xl shadow-md object-cover">
                                <h3 class="mt-2 text-xs font-bold text-slate-800 truncate w-24">${app.title}</h3>
                            </div>
                        `;
                    });
                    content.appendChild(section);
                }
            });
        }

        // Listener for search input
        searchInput.addEventListener('input', (e) => render(e.target.value));
        
        // Initial render
        render();
    </script>
</body>
</html>
