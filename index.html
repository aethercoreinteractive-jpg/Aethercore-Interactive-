<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aethercore Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
</head>
<body class="bg-white text-slate-900">
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b px-6 py-4 flex items-center z-50">
        <img src="Aethercore Logo.png" class="h-8 mr-4">
        <h1 class="text-xl font-bold">Aethercore Interactive</h1>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div>
    </main>

    <script>
        const grid = document.getElementById('grid');
        aetherCoreApps.forEach(app => {
            grid.innerHTML += `
                <div onclick="viewApp(${app.id})" class="group cursor-pointer">
                    <img src="${app.logo}" class="rounded-3xl shadow-lg group-hover:scale-105 transition-all duration-300">
                    <h3 class="mt-3 font-semibold text-sm truncate">${app.title}</h3>
                </div>
            `;
        });
        function viewApp(id) {
            localStorage.setItem('selectedApp', id);
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
