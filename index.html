<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethercore | Engineering the Future</title>
    <style>
        :root {
            --navy: #0a192f;
            --gold: #c5a059;
            --white: #ffffff;
            --soft-bg: #f8f9fa;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--soft-bg); margin: 0; color: #333; }

        /* Modernized Header */
        header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo { height: 32px; }

        /* Sleek Cards instead of Boxes */
        .module { background: var(--white); margin: 20px; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        /* Modern Inputs */
        input, textarea { width: 100%; border: 2px solid #edf2f7; border-radius: 12px; padding: 15px; margin-bottom: 15px; background: #f7fafc; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }
        .btn-modern { background: var(--navy); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; }

        /* Fluid Portfolio Grid */
        .grid-modern { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card-modern { background: #fdfdfd; border: 1px solid #eee; padding: 20px; border-radius: 16px; text-align: center; font-size: 0.85rem; font-weight: 500; }

        .footer-mod { text-align: center; padding: 40px; color: #718096; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <img src="Aethercore Logo.png" class="logo">
        <div style="font-size: 1.2rem; font-weight: 800; color: var(--navy);">☰</div>
    </header>

    <div style="padding: 20px 20px 0;">
        <h1 style="font-size: 2rem; color: var(--navy);">Strategic Engineering</h1>
    </div>

    <section class="module">
        <h2 style="font-size: 1rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Project Inquiry</h2>
        <input type="text" placeholder="Project Name">
        <textarea placeholder="Tell us about your technical requirements..." rows="4"></textarea>
        <button class="btn-modern">INITIATE PARTNERSHIP</button>
    </section>

    <section class="module">
        <h2 style="font-size: 1rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Track Record</h2>
        <div class="grid-modern">
            <div class="card-modern">FinTech OS</div>
            <div class="card-modern">Cloud ERP</div>
            <div class="card-modern">AI Logistics</div>
            <div class="card-modern">Cyber Defense</div>
        </div>
    </section>

    <footer class="footer-mod">
        <p>Contact Office</p>
        <p style="color: var(--navy); font-weight: bold; font-size: 1.1rem; margin: 10px 0;">aethercoreinteractive@gmail.com</p>
        <p>Aethercore Global © 2026</p>
    </footer>

</body>
</html>
