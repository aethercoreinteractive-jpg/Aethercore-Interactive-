<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercore Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-white text-gray-900">

    <header class="sticky top-0 bg-white/95 backdrop-blur-sm z-50 px-6 pt-6 pb-4 border-b border-gray-100">
        <div class="flex items-center gap-3 mb-5">
            <img src="Aethercore Logo.png" class="w-8 h-8 object-contain">
            <h1 class="text-lg font-bold tracking-tight">Aethercore Interactive</h1>
        </div>
        <input type="text" id="searchInput" placeholder="Search ecosystem..." 
               class="w-full bg-gray-50 rounded-xl px-4 py-2.5 text-sm outline-none border border-gray-200 focus:border-gray-400 transition-all">
    </header>

    <main id="store-content" class="py-4"></main>

    <script src="data.js"></script>
    <script>
        const content = document.getElementById('store-content');
        const searchInput = document.getElementById('searchInput');

        function render(filter = "") {
            content.innerHTML = "";
            const query = filter.toLowerCase();
            const sortedCategories = Object.keys(categoryOrder).sort((a, b) => categoryOrder[a] - categoryOrder[b]);

            sortedCategories.forEach(cat => {
                const apps = aetherCoreApps.filter(a => a.category === cat && 
                    (a.title.toLowerCase().includes(query) || a.description.toLowerCase().includes(query)));
                
                if (apps.length > 0) {
                    const section = document.createElement('section');
                    section.className = "mb-10";
                    section.innerHTML = `<h2 class="px-6 text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">${cat}</h2><div class="flex gap-4 px-6 overflow-x-auto hide-scrollbar"></div>`;
                    
                    const row = section.querySelector('.flex');
                    apps.forEach(app => {
                        row.innerHTML += `
                            <div onclick="window.location.href='app.html?id=${app.id}'" class="min-w-[80px] flex flex-col items-center cursor-pointer group">
                                <div class="w-16 h-16 rounded-[18px] shadow-sm overflow-hidden border border-gray-100 group-hover:shadow-md transition-shadow">
                                    <img src="${app.logo}" class="w-full h-full object-cover">
                                </div>
                                <span class="mt-2 text-[11px] font-medium text-center text-gray-700 leading-tight w-20 truncate">${app.title}</span>
                            </div>
                        `;
                    });
                    content.appendChild(section);
                }
            });
        }
        searchInput.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
