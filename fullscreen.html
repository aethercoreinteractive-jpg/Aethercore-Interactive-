<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="data.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
        .swiper { width: 100%; height: 100dvh; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        
        /* Minimalist professional dot styling */
        .swiper-pagination-bullet { background: #fff !important; opacity: 0.5 !important; }
        .swiper-pagination-bullet-active { opacity: 1 !important; transform: scale(1.2); }
        .swiper-pagination { bottom: 30px !important; }
    </style>
</head>
<body>

    <button onclick="history.back()" class="absolute top-6 left-6 z-50 p-2 text-white bg-black/30 rounded-full backdrop-blur-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <div class="swiper fullscreenSwiper">
        <div class="swiper-wrapper" id="fullscreenSlides"></div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const startIndex = parseInt(params.get('index') || 0);
            
            const app = aetherCoreApps.find(a => a.id == id);
            
            if (app) {
                const container = document.getElementById('fullscreenSlides');
                container.innerHTML = app.preview.map(p => {
                    const isVideo = p.endsWith('.mp4') || p.endsWith('.webm');
                    return `
                    <div class="swiper-slide">
                        ${isVideo 
                            ? `<video src="${p}" class="w-full h-full object-contain" controls playsinline></video>` 
                            : `<img src="${p}" class="w-full h-full object-contain">`}
                    </div>`;
                }).join('');
                
                new Swiper(".fullscreenSwiper", {
                    initialSlide: startIndex,
                    slidesPerView: 1,
                    pagination: {
                        el: ".swiper-pagination",
                        clickable: true,
                    }
                });
            }
        });
    </script>
</body>
</html>
