<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="data.js"></script>
</head>
<body class="bg-white">

    <button onclick="history.back()" class="p-4 text-2xl">←</button>

    <div class="px-6 pb-4 flex items-center gap-4">
        <img id="logo" class="w-20 h-20 rounded-2xl shadow-md">
        <div>
            <h1 id="title" class="text-xl font-bold"></h1>
            <p class="text-green-700 font-bold text-sm">Aethercore Interactive</p>
        </div>
    </div>

    <div class="px-6 mb-6">
        <a id="btn" href="#" class="block w-full bg-green-700 text-white text-center py-3 rounded font-bold text-lg hover:bg-green-800 transition">Open</a>
    </div>

    <div class="swiper mySwiper w-full h-64 mb-6">
        <div class="swiper-wrapper" id="slides"></div>
    </div>

    <div class="px-6 pb-20">
        <h2 class="font-bold text-lg mb-2">About this app</h2>
        <p id="desc" class="text-gray-600 text-sm leading-relaxed"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const app = aetherCoreApps.find(a => a.id == id);
        document.getElementById('title').innerText = app.title;
        document.getElementById('desc').innerText = app.description;
        document.getElementById('logo').src = app.logo;
        document.getElementById('btn').href = app.url;
        document.getElementById('slides').innerHTML = app.preview.map(p => 
            `<div class="swiper-slide px-2"><img src="${p}" class="h-full w-full object-cover rounded-xl border border-gray-100"></div>`).join('');
        new Swiper(".mySwiper", { slidesPerView: 1.2, spaceBetween: 0 });
    </script>
</body>
</html>
