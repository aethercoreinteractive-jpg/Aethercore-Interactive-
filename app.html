<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lightgallery.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lg-pager.min.css"/>
    <script src="data.js"></script>
    <style>
        /* Force the popup to cover the actual screen and center its content */
        .lg-outer { 
            background: rgba(0,0,0,0.9) !important; 
            position: fixed !important; 
            inset: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important; 
        }
        
        .lg-outer .lg-inner { 
            display: flex !important; 
            flex-direction: column !important; 
            align-items: center !important; 
            justify-content: center !important; 
            width: 100% !important; 
            height: 100% !important; 
            padding: 0 !important; 
            margin: 0 !important;
        }
        
        /* The Window Frame - Using fixed size relative to viewport */
        .lg-outer .lg-img-wrap { 
            flex: 0 0 auto !important; 
            width: 80vw !important; 
            max-width: 320px !important; 
            height: auto !important;
            max-height: 60vh !important; 
            aspect-ratio: 1 / 1.5 !important; 
            border: 2px solid rgba(255,255,255,0.15); 
            border-radius: 24px; 
            overflow: hidden; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            background: #121417; 
            margin: 0 auto !important;
        }
        
        .lg-outer .lg-object { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain !important; 
        }
        
        .lg-outer .lg-pager-outer { 
            position: relative !important; 
            margin-top: 20px !important; 
            width: 100% !important; 
            display: flex !important; 
            justify-content: center !important; 
        }
    </style>
</head>
<body class="bg-[#121417] text-[#E2E8F0]">

    <button onclick="history.back()" class="p-4 text-2xl text-blue-400">←</button>

    <div class="px-6 pb-6 flex items-center gap-4">
        <img id="logo" class="w-20 h-20 rounded-2xl shadow-md border border-[#2D3238]">
        <div>
            <h1 id="title" class="text-xl font-bold text-[#F8FAFC]"></h1>
            <p class="text-blue-400 font-bold text-sm">Aethercore Interactive</p>
        </div>
    </div>

    <div class="px-6 mb-8">
        <a id="btn" href="#" class="block w-full bg-[#1E2126] border border-blue-500 text-blue-400 text-center py-3 rounded-2xl font-bold text-lg hover:bg-blue-600 hover:text-white transition-all">Open App</a>
    </div>

    <div class="swiper mySwiper w-full h-auto mb-2">
        <div class="swiper-wrapper" id="slides"></div>
        <div class="swiper-pagination !relative mt-4"></div>
    </div>

    <div class="px-6 pb-20">
        <h2 class="font-bold text-lg mb-2 text-[#F8FAFC]">About this app</h2>
        <p id="desc" class="text-gray-400 text-sm leading-relaxed"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/pager/lg-pager.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const id = new URLSearchParams(window.location.search).get('id');
            const app = aetherCoreApps.find(a => a.id == id);
            
            if (app) {
                document.getElementById('title').innerText = app.title;
                document.getElementById('desc').innerText = app.description;
                document.getElementById('logo').src = app.logo;
                document.getElementById('btn').href = app.url;
                
                document.getElementById('slides').innerHTML = app.preview.map(p => {
                    const isVideo = p.endsWith('.mp4') || p.endsWith('.webm');
                    return `
                    <div class="swiper-slide flex justify-center">
                        <div class="aspect-video w-[90%] overflow-hidden rounded-2xl border border-[#2D3238] bg-[#1E2126] cursor-pointer" 
                             data-src="${p}">
                            ${isVideo 
                                ? `<video src="${p}" class="w-full h-full object-cover" controls playsinline></video>` 
                                : `<img src="${p}" class="w-full h-full object-cover">`}
                        </div>
                    </div>`;
                }).join('');
                
                new Swiper(".mySwiper", { 
                    slidesPerView: 1, 
                    spaceBetween: 0,
                    pagination: { el: ".swiper-pagination", clickable: true }
                });
                
                lightGallery(document.getElementById('slides'), {
                    selector: '.swiper-slide > div',
                    plugins: [lgPager],
                    licenseKey: '0000-0000-000-0000',
                    loop: true,
                    fullScreen: false,
                    zoom: true,
                    pager: true,
                    controls: false,
                    hash: false,
                    mobileSettings: {
                        controls: false,
                        showCloseIcon: true,
                        download: false
                    }
                });
            }
        });
    </script>
</body>
</html>
