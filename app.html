<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="data.js"></script>
</head>
<body class="bg-white">
    <button onclick="history.back()" class="fixed top-4 left-4 z-50 bg-black/50 p-2 rounded-full text-white">←</button>

    <div class="relative">
        <div class="swiper mySwiper w-full h-[40vh] bg-gray-100">
            <div class="swiper-wrapper" id="slides"></div>
        </div>
        <div class="p-6">
            <div class="flex items-center gap-4 -mt-12">
                <img id="logo" class="w-20 h-20 rounded-2xl shadow-xl border-4 border-white">
                <h1 id="title" class="text-xl font-black mt-8"></h1>
            </div>
            <p id="desc" class="mt-6 text-gray-600 text-sm leading-relaxed"></p>
        </div>
    </div>

    <div class="fixed bottom-0 w-full p-4 bg-white border-t">
        <a id="btn" href="#" class="block w-full bg-blue-600 text-white text-center py-4 rounded-xl font-bold text-lg active:bg-blue-700">INSTALL</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const app = aetherCoreApps.find(a => a.id == localStorage.getItem('selectedApp'));
        document.getElementById('title').innerText = app.title;
        document.getElementById('desc').innerText = app.description;
        document.getElementById('logo').src = app.logo;
        document.getElementById('btn').href = app.url;
        document.getElementById('slides').innerHTML = app.preview.map(p => 
            `<div class="swiper-slide"><img src="${p}" class="w-full h-full object-cover"></div>`).join('');
        new Swiper(".mySwiper", { slidesPerView: 1 });
    </script>
</body>
</html>
