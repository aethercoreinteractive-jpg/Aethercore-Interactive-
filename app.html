<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>App Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="data.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="p-8 flex items-center gap-6 border-b">
            <img id="logo" class="w-24 h-24 rounded-2xl shadow-md">
            <div>
                <h1 id="title" class="text-3xl font-black"></h1>
                <a id="btn" href="#" class="mt-4 inline-block bg-blue-600 text-white px-8 py-3 rounded-full font-bold">Install</a>
            </div>
        </div>
        
        <div class="p-8">
            <div class="swiper mySwiper w-full h-80">
                <div class="swiper-wrapper" id="slides"></div>
            </div>
            <p id="desc" class="mt-8 text-slate-600 leading-relaxed text-lg"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const app = aetherCoreApps.find(a => a.id == localStorage.getItem('selectedApp'));
        document.getElementById('title').innerText = app.title;
        document.getElementById('desc').innerText = app.description;
        document.getElementById('logo').src = app.logo;
        document.getElementById('btn').href = app.url;
        document.getElementById('slides').innerHTML = app.preview.map(p => 
            `<div class="swiper-slide"><img src="${p}" class="w-full h-full object-cover rounded-2xl"></div>`).join('');
        new Swiper(".mySwiper", { slidesPerView: 2, spaceBetween: 20 });
    </script>
</body>
</html>
