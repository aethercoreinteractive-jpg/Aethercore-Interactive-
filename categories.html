<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercore | Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #121417; color: #E2E8F0; padding-bottom: 80px; }
        .surface { background-color: #1E2126; border: 1px solid #2D3238; }
        .glass-nav { background: rgba(18, 20, 23, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid #2D3238; }
        .text-header { color: #F8FAFC; }
        .nav-link.active { color: #60a5fa; }
        .nav-link { color: #6b7280; }
        a { touch-action: manipulation; }
    </style>
</head>
<body>

    <header class="glass-nav sticky top-0 z-50 px-6 pt-6 pb-4">
        <div class="flex items-center gap-3 mb-5">
            <img src="Aethercore Logo.png" class="w-10 h-10 rounded-full border border-gray-600 object-cover shadow-lg">
            <h1 class="text-xl font-bold text-header tracking-tight">Aethercore <span class="text-blue-400">Categories</span></h1>
        </div>
    </header>

    <main id="cat-content" class="py-6 px-6">
        <div id="category-list" class="grid grid-cols-2 gap-4"></div>
        <div id="app-results" class="hidden">
            <button onclick="history.back()" class="text-blue-400 text-sm font-bold mb-6 flex items-center gap-1">← Back</button>
            <div id="app-grid" class="grid grid-cols-3 gap-4"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full glass-nav border-t border-gray-700 flex justify-around py-3 z-50">
        <a href="index.html" class="nav-link flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="apps.html" class="nav-link flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold uppercase">Apps</span>
        </a>
        <a href="games.html" class="nav-link flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold uppercase">Games</span>
        </a>
        <a href="categories.html" class="nav-link flex flex-col items-center gap-1 active">
            <span class="text-[10px] font-bold uppercase">Categories</span>
        </a>
    </footer>

    <script src="data.js"></script>
    <script>
        const catList = document.getElementById('category-list');
        const appResults = document.getElementById('app-results');
        const appGrid = document.getElementById('app-grid');

        function initCategories() {
            const sortedCategories = Object.keys(categoryOrder).sort((a, b) => categoryOrder[a] - categoryOrder[b]);
            sortedCategories.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = "surface p-4 rounded-xl cursor-pointer hover:border-blue-500 transition-all text-center font-bold text-sm";
                btn.innerText = cat;
                btn.onclick = () => {
                    history.pushState({ category: cat }, "");
                    showCategoryApps(cat);
                };
                catList.appendChild(btn);
            });
        }

        function showCategoryApps(catName) {
            catList.classList.add('hidden');
            appResults.classList.remove('hidden');
            const apps = aetherCoreApps.filter(app => app.category === catName);
            appGrid.innerHTML = `<h2 class="col-span-3 text-xl font-bold text-white mb-2">${catName}</h2>`;
            apps.forEach(app => {
                appGrid.innerHTML += `
                    <div onclick="window.location.href='app.html?id=${app.id}'" class="flex flex-col items-center cursor-pointer">
                        <div class="w-20 h-20 surface rounded-[22px] flex items-center justify-center overflow-hidden">
                            <img src="${app.logo}" class="w-full h-full object-cover">
                        </div>
                        <span class="mt-2 text-[12px] font-semibold text-center truncate w-20">${app.title}</span>
                    </div>
                `;
            });
        }

        // Listen for back button press
        window.onpopstate = (event) => {
            if (event.state && event.state.category) {
                showCategoryApps(event.state.category);
            } else {
                appResults.classList.add('hidden');
                catList.classList.remove('hidden');
            }
        };

        initCategories();
    </script>
</body>
</html>
